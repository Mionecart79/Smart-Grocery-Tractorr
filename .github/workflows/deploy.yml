name: PWA CI/CD & GitHub Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: 🧪 Quality & PWA Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Core PWA Files Exist
        run: |
          echo "Verifying PWA asset structure..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f styles.css || (echo "Missing styles.css" && exit 1)
          test -f app.js || (echo "Missing app.js" && exit 1)
          test -f sw.js || (echo "Missing sw.js" && exit 1)
          test -f manifest.json || (echo "Missing manifest.json" && exit 1)
          test -f icons/icon-192.png || (echo "Missing icon-192.png" && exit 1)
          test -f icons/icon-512.png || (echo "Missing icon-512.png" && exit 1)
          echo "All essential PWA files exist!"

      - name: Validate manifest.json
        run: |
          node -e "
            const manifest = require('./manifest.json');
            if (!manifest.name || !manifest.start_url || !manifest.icons) {
              console.error('Invalid manifest.json structure');
              process.exit(1);
            }
            console.log('manifest.json validated successfully: ' + manifest.name);
          "

      - name: Syntax Check JavaScript (app.js & sw.js)
        run: |
          node --check app.js
          node --check sw.js
          echo "JavaScript syntax checks passed!"

      - name: Validate HTML Structure & PWA Meta Tags
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const checks = [
              { name: 'Viewport Meta', test: /meta\s+name=[\"']viewport[\"']/i },
              { name: 'Manifest Link', test: /link\s+rel=[\"']manifest[\"']/i },
              { name: 'App Script Tag', test: /script\s+src=[\"']app\.js[\"']/i },
              { name: 'Stylesheet Link', test: /link\s+rel=[\"']stylesheet[\"']/i }
            ];
            for (const c of checks) {
              if (!c.test.test(html)) {
                console.error('HTML check failed: ' + c.name);
                process.exit(1);
              }
            }
            console.log('All HTML & PWA meta tag checks passed!');
          "

  deploy-gh-pages:
    name: 🚀 Deploy to GitHub Pages (gh-pages branch)
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: Live Website (GitHub Pages)
      url: https://mionecart79.github.io/Smart-Grocery-Tractorr/
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: |
            .git
            .github

      - name: Output Live Web URLs & Review Guide for Evaluator/Guru
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PAGES_URL="https://${REPO_OWNER,,}.github.io/${REPO_NAME}/"
          SETTINGS_PAGES_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/settings/pages"
          VERCEL_DEPLOY_URL="https://vercel.com/new/clone?repository-url=https%3A%2F%2Fgithub.com%2F${REPO_OWNER}%2F${REPO_NAME}"
          
          echo "::notice title=🌐 LINK WEB LIVE PENGUJIAN GURU::${PAGES_URL}"
          
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🛒 Smart Grocery & Budget Safety Tracker Widihh

          ## 🌐 Tautan Web Live (Siap Diuji Langsung oleh Guru):
          ### 👉 **[BUKA APLIKASI WEB LIVE (GITHUB PAGES)](${PAGES_URL})**
          **URL Publik:** \`${PAGES_URL}\`

          ---

          ### 📱 Uji Coba di Smartphone (Scan Barcode):
          Arahkan kamera smartphone ke kode QR di bawah untuk membuka dan memasang aplikasi secara instan (*Add to Home Screen*):

          <p align="center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${PAGES_URL}" alt="Scan QR Code PWA" width="220" height="220" />
          </p>

          ---

          ### ⚡ Opsi Alternatif: Live di Vercel (1-Click Deployment)
          Jika ingin membuka alternatif instan di Vercel:
          👉 **[Deploy ke Vercel via GitHub (${REPO_NAME})](${VERCEL_DEPLOY_URL})**

          ---

          ### 📝 Panduan Singkat untuk Guru / Penilai:
          1. **Pilih Daerah & Supermarket**: Coba filter daerah (misal: *Jakarta Barat* ➔ *Lotte Mart Grocery - Puri Indah*).
          2. **Tentukan Budget**: Ketik nominal budget (misal: *Rp 250.000*) lalu klik tombol **Confirm**. Perhatikan bahwa budget terkunci otomatis.
          3. **Tab Store**: Klik **Add to list** pada produk diskon (rumus: \`Harga2 = Harga - (Diskon * Harga)\`) dan perhatikan tren inflasi (⬆ merah, ⬇︎ hijau, = kuning). Sisa budget di pojok kanan atas akan berkurang secara live.
          4. **Tab List (Keranjang)**: Perhatikan transisi warna font total belanja yang awalnya **Coklat (\`#622B14\`)** fading secara mulus menjadi **Full Merah** saat budget habis. Gunakan kontrol quantity \`- [ ] +\` dan tombol hapus \`X\`.
          5. **Checkout**: Kunci belanjaan dengan tombol **Checkout**, dan lihat struk belanja tersimpan rapi di tab **History**.

          ---
          > ⚠️ **Catatan Aktivasi Pertama Kali di GitHub Pages:**
          > Pastikan di repository settings [**Settings > Pages**](${SETTINGS_PAGES_URL}) telah dipilih **Source: Deploy from a branch** dengan branch **\`gh-pages\`**.
          EOF

  deploy-actions-pages:
    name: 🌐 Deploy via GitHub Pages Actions
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
